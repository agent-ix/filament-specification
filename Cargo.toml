[package]
name = "filament-specification-qualification"
version = "0.1.1"
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-or-later"
publish = false
description = "Authored definition documents by reference, plus qualification tests"

# The library has no dependencies, so a git-dependency consumer builds only the
# authored bytes it exposes; everything below is dev-only qualification.
[lib]
name = "filament_specification"
path = "src/lib.rs"

[dev-dependencies]
filament-verification-contracts = { git = "https://github.com/agent-ix/filament-verification-contracts", tag = "v0.2.0" }
jsonschema = { version = "=0.55.0", default-features = false }
serde_json = "=1.0.151"
num-bigint = "=0.4.8"
num-integer = "=0.1.47"
ix-trace-rs = { git = "https://github.com/agent-ix/ix-trace-rs", tag = "v0.1.2" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
